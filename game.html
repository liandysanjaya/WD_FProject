<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSC Easter Egg Clicking Game</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .game-container {
            text-align: center;
            padding: 50px 20px;
            background-color: #ffdbdb;
            min-height: 100vh;
        }
        .click-button {
            background-color: rgb(149, 51, 51);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .click-button:hover {
            transform: scale(1.05);
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            color: rgb(137, 54, 54);
            margin: 20px 0;
        }
        .instructions {
            font-size: 18px;
            margin-bottom: 30px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand nav-link" href="index.html"><img class="logo" src="assets/logo.png" alt="Logo" style="width: 30px; height: 30px; border-radius: 50%; margin-right: 10px;">The Singing Choir</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Go Back Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <br><br><br>
    <!-- Game Section -->
    <section class="game-container">
        <div class="container">
            <h1 class="text-center mb-4 fw-semibold" style="color: rgb(137, 54, 54);">TSC Easter Egg Game</h1>
            <p class="instructions">Click the choir logo as fast as you can to earn points! The faster you click, the higher your score!</p>
            <div class="score">Score: <span id="score">0</span></div>
            <button id="clickButton" class="click-button">
                <img src="assets/logo.png" alt="Choir Logo" style="width: 100px; height: 100px; border-radius: 50%;">
                <br>Click Me!
            </button>
            <p class="mt-3">Clicks per second: <span id="cps">0</span></p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2024 The Singing Choir. All rights reserved.</p>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        let score = 0;
        let clicks = [];
        const clickButton = document.getElementById('clickButton');
        const scoreDisplay = document.getElementById('score');
        const cpsDisplay = document.getElementById('cps');

        clickButton.addEventListener('click', function() {
            score++;
            scoreDisplay.textContent = score;
            clicks.push(Date.now());

            // Calculate clicks per second
            const now = Date.now();
            clicks = clicks.filter(time => now - time < 1000);
            cpsDisplay.textContent = clicks.length;

            // Add visual feedback
            clickButton.style.transform = 'scale(0.95)';
            setTimeout(() => {
                clickButton.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
